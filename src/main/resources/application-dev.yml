
spring:
  application:
    name: edu-ai-backend

  datasource:
    url: jdbc:mysql://localhost:3306/edu_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

