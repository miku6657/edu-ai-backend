
spring:
  application:
    name: edu-ai-backend

  datasource:
    url: jdbc:mysql://localhost:3306/edu_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 32MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    internal-key: ${AI_INTERNAL_KEY}

app:
  storage:
    pdf-dir: ${PDF_STORAGE_DIR:./uploads/pdfs}

